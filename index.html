<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly Markdown 实时预览器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Typography Plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- FontAwesome 最新版 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- CodeMirror 6 ESM Import Map -->
    <script type="importmap">
    {
      "imports": {
        "@codemirror/state": "https://esm.sh/@codemirror/state",
        "@codemirror/view": "https://esm.sh/@codemirror/view",
        "@codemirror/commands": "https://esm.sh/@codemirror/commands",
        "@codemirror/language": "https://esm.sh/@codemirror/language",
        "@codemirror/search": "https://esm.sh/@codemirror/search",
        "@codemirror/lang-markdown": "https://esm.sh/@codemirror/lang-markdown",
        "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark",
        "@codemirror/language-data": "https://esm.sh/@codemirror/language-data",
        "@lezer/highlight": "https://esm.sh/@lezer/highlight"
      }
    }
    </script>

    <!-- [优化首屏加载]：所有非强依赖 UI 骨架逻辑的重型核心库全部加上 defer，让出关键渲染路径 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-footnote@1.2.4/dist/index.umd.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js"></script>
    <!-- Mermaid & Echarts -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
    <!-- JSON5 用于更宽松、安全地解析 ECharts 配置 -->
    <script src="https://cdn.jsdelivr.net/npm/json5@2.2.3/dist/index.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class', 
            theme: { extend: { colors: { primary: '#3b82f6', secondary: '#1e293b' } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* CodeMirror 6 定制样式 */
        .cm-editor { height: 100% !important; outline: none !important; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important; font-size: 15px; }
        .cm-scroller { overflow: auto; padding: 1rem; }
        .cm-content { padding: 0 !important; color: #1f2937; }
        .dark .cm-content { color: #e2e8f0; }
        .cm-activeLine { background-color: rgba(59, 130, 246, 0.05) !important; }
        .dark .cm-activeLine { background-color: rgba(255, 255, 255, 0.05) !important; }
        .cm-gutters { background-color: transparent !important; border-right: none !important; color: #9ca3af !important; }
        .cm-foldPlaceholder { background-color: #e2e8f0; border:none; color: #64748b; padding: 0 4px; border-radius: 2px; }
        .dark .cm-foldPlaceholder { background-color: #334155; color: #94a3b8; }
        
        /* 动画与过场 */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease-out; }
        .toast-leave { transform: translateY(0); opacity: 1; }
        .toast-leave-active { transform: translateY(100%); opacity: 0; transition: all 0.3s ease-in; }
        
        #file-sidebar, #file-sidebar-collapsed, #toc-pane { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s; }
        
        @media (min-width: 768px) {
            #editor-pane { min-width: 0; }
            #preview-container { flex: 1; min-width: 0; }
            #main-workspace.is-preview-mode #editor-pane { flex: 0 0 0% !important; width: 0% !important; opacity: 0; border: none; overflow: hidden; padding:0; margin:0; }
            #main-workspace.is-preview-mode #main-resizer { display: none !important; }
        }
        @media (max-width: 767px) {
            #editor-pane { transition: max-height 0.4s ease, opacity 0.3s ease; }
            #main-workspace.is-preview-mode #editor-pane { max-height: 0; opacity: 0; border-width: 0; overflow: hidden; padding:0; margin:0;}
        }
        
        #app-container:fullscreen { max-width: 100% !important; padding: 0 !important; gap: 0 !important; }
        #app-container:fullscreen .core-area, #app-container:fullscreen #file-sidebar { border-radius: 0; border:none; border-right: 1px solid #d1d5db; }
        .dark #app-container:fullscreen .core-area, .dark #app-container:fullscreen #file-sidebar { border-right-color: #334155; }

        html { scroll-behavior: smooth; }
        .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 { scroll-margin-top: 5rem; }

        .mermaid { display: block; overflow-x: auto; text-align: center; width: 100%; margin: 1.5rem 0; }
        .mermaid svg { display: inline-block; min-width: 650px; max-width: 100%; height: auto; }

        /* 全局搜索匹配高亮 (保留底层高亮，移除原生面板样式) */
        .cm-searchMatch { background: #fef08a !important; color: #854d0e !important; border-radius: 2px; }
        .dark .cm-searchMatch { background: #854d0e !important; color: #fef08a !important; }
        .cm-searchMatch-selected { background: #f97316 !important; color: #fff !important; box-shadow: 0 0 0 2px rgba(249,115,22,0.4); border-radius: 2px; }
        .dark .cm-searchMatch-selected { background: #ea580c !important; color: #fff !important; }

        /* [浏览器兼容性优化]：提供无伪类的回退选择器（.task-list 和 .task-list-item），由 JS 动态装载 */
        .prose a { color: #3b82f6 !important; text-decoration: none !important; transition: all 0.2s; }
        .prose a:hover { text-decoration: underline !important; }
        .prose ul:has(input[type="checkbox"]), .prose ul.task-list { padding-left: 0; }
        .prose li:has(input[type="checkbox"]), .prose li.task-list-item { list-style-type: none !important; padding-left: 0 !important; margin-left: 0 !important; display: flex; align-items: flex-start; gap: 0.5rem; }
        .prose li:has(input[type="checkbox"])::marker, .prose li.task-list-item::marker { content: none; display: none; }
        .prose li:has(input[type="checkbox"])::before, .prose li.task-list-item::before { display: none !important; content: none !important; }
        .prose input[type="checkbox"] { margin-top: 0.35rem; cursor: pointer; }
        
        .prose code:not(pre code) { background-color: #f1f5f9; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-weight: 500; }
        .dark .prose code:not(pre code) { background-color: #334155; }
        .prose code::before, .prose code::after { content: none !important; }
        .prose pre { background-color: #0d1117 !important; border: 1px solid #30363d; padding: 1rem; border-radius: 0.5rem; }
        .dark .prose pre { background-color: #161b22 !important; border-color: #30363d; }
        .prose pre code { background-color: transparent !important; color: inherit !important; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace !important; }
        .prose table { border-collapse: collapse !important; width: 100%; border: 1px solid #e5e7eb !important; overflow: hidden; border-radius: 0.375rem; margin-top: 1rem; margin-bottom: 1rem; }
        .dark .prose table { border-color: #334155 !important; }
        .prose th, .prose td { border: 1px solid #e5e7eb !important; padding: 0.6rem 1rem !important; }
        .dark .prose th, .dark .prose td { border-color: #334155 !important; }
        .prose thead { background-color: #f8fafc; }
        .dark .prose thead { background-color: #1e293b; }
        .prose thead th { font-weight: 600; color: #1f2937; border-bottom-width: 2px !important; }
        .dark .prose thead th { color: #e2e8f0; }

        /* 脚注样式补充 */
        .prose .footnotes { font-size: 0.875rem; color: #6b7280; border-top: 1px solid #e5e7eb; padding-top: 1rem; margin-top: 2rem; }
        .dark .prose .footnotes { border-color: #334155; color: #9ca3af; }
        .prose .footnotes ol { padding-left: 1.5rem; margin-top: 0.5rem; list-style-type: decimal; }
        .prose .footnotes li { margin-bottom: 0.5rem; }
        .prose .footnotes li::marker { color: #9ca3af; font-weight: 600; }

        .file-item { min-width: 0; }
        .file-item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body class="bg-gray-200 dark:bg-slate-900 h-screen flex flex-col items-center p-0 lg:p-4 text-gray-800 dark:text-gray-200 font-sans transition-colors duration-300 overflow-hidden">

    <div class="flex items-center justify-center py-3 shrink-0 px-2 lg:px-0 w-full">
        <i class="fa-brands fa-markdown text-blue-600 dark:text-blue-400 text-3xl mr-3"></i>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-gray-100 tracking-tight">Fly Markdown 实时预览器</h1>
    </div>

    <div id="app-container" class="flex flex-row gap-3 md:gap-4 w-full max-w-[1600px] flex-1 min-h-[600px] mb-2 px-2 md:px-0 relative h-[calc(100vh-80px)]">

        <!-- 左侧文件管理 -->
        <aside id="file-sidebar" class="w-56 lg:w-64 flex flex-col bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl shadow-xl shrink-0 z-40 relative h-full overflow-hidden transition-all duration-300">
            <div class="px-4 py-3 border-b border-gray-200 dark:border-slate-700 shrink-0 flex justify-between items-center bg-gray-100 dark:bg-slate-900 h-[55px]">
                <span class="text-base font-bold text-gray-700 dark:text-gray-300"><i class="fa-solid fa-folder-tree text-orange-500 mr-1.5"></i> 资源库</span>
                <div class="flex gap-2">
                    <button id="btn-new-folder" onclick="reqCreateNewFolder('root')" class="text-gray-500 hover:text-yellow-600 transition" title="根目录新建文件夹"><i class="fa-solid fa-folder-plus text-base"></i></button>
                    <button onclick="reqCreateNewFile('root')" class="text-gray-500 hover:text-green-500 transition" title="根目录新建文件"><i class="fa-solid fa-plus text-base"></i></button>
                    <button onclick="collapseFileSidebar()" class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 transition" title="向左隐藏"><i class="fa-solid fa-chevron-left text-base"></i></button>
                </div>
            </div>
            
            <div class="px-3 py-2 border-b border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-900 flex gap-1 relative z-10 shrink-0">
                <button onclick="setStorageMode('browser')" id="btn-mode-browser" class="flex-1 py-1.5 text-xs rounded-md bg-blue-100 text-blue-700 dark:bg-slate-700 dark:text-blue-400 font-bold transition shadow-sm border border-blue-200 dark:border-slate-600"><i class="fa-solid fa-window-maximize mr-1"></i>浏览器缓存</button>
                <button onclick="setStorageMode('local')" id="btn-mode-local" class="flex-1 py-1.5 text-xs rounded-md text-gray-600 hover:bg-gray-200 dark:text-gray-400 dark:hover:bg-slate-800 transition border border-transparent hover:border-gray-300 dark:hover:border-slate-600"><i class="fa-solid fa-hard-drive mr-1"></i>本地直连</button>
            </div>
            
            <div class="p-2 border-b border-gray-200 dark:border-slate-700 shrink-0">
                <div class="relative">
                    <i class="fa-solid fa-search absolute left-2.5 top-2 text-gray-400 text-sm"></i>
                    <input type="text" id="file-search-input" oninput="renderFileList()" placeholder="搜索文件..." class="w-full text-sm pl-8 pr-2 py-1.5 rounded bg-white dark:bg-slate-950 border border-gray-300 dark:border-slate-600 text-gray-700 dark:text-gray-300 outline-none focus:border-blue-500 transition-colors">
                </div>
            </div>
            <div id="file-list" class="flex-1 overflow-y-auto py-2 space-y-0.5 text-sm pb-10"></div>
        </aside>

        <!-- 侧边栏折叠状态 -->
        <aside id="file-sidebar-collapsed" class="hidden w-16 flex flex-col bg-white dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl shadow-xl shrink-0 z-40 transition-all duration-300 items-center py-4 h-fit self-start">
             <button onclick="expandFileSidebar()" class="text-gray-500 hover:text-orange-500 transition mb-4" title="展开资源库"><i class="fa-solid fa-folder-tree text-xl"></i></button>
             <div class="w-10 h-px bg-gray-200 dark:bg-slate-700 mb-4"></div>
             <button onclick="reqCreateNewFile('root')" class="text-gray-500 hover:text-green-500 transition mb-4" title="新建文件"><i class="fa-solid fa-plus text-xl"></i></button>
             <button id="btn-new-folder-collapsed" onclick="reqCreateNewFolder('root')" class="text-gray-500 hover:text-yellow-600 transition" title="新建文件夹"><i class="fa-solid fa-folder-plus text-xl"></i></button>
        </aside>

        <div class="core-area flex flex-col flex-1 min-w-0 h-full bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-gray-300 dark:border-slate-700 overflow-hidden">
            
            <header class="bg-gray-50 dark:bg-slate-900 border-b border-gray-200 dark:border-slate-700 z-30 flex flex-col md:flex-row md:items-center px-4 py-2.5 shrink-0 w-full">
                <div class="flex flex-wrap items-center gap-2 w-full">
                    <div class="flex bg-white dark:bg-slate-800 rounded p-1 border border-gray-200 dark:border-slate-700 shrink-0 shadow-sm transition-colors">
                        <button onclick="document.getElementById('file-upload').click()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-gray-700 dark:text-gray-300 text-sm" title="导入内容"><i class="fa-solid fa-file-import text-yellow-600 text-base"></i> <span class="hidden xl:inline font-medium">导入</span></button>
                        <input type="file" id="file-upload" accept=".md,.txt" class="hidden" onchange="handleFileUpload(event)">
                        <button onclick="pasteContent()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-gray-700 dark:text-gray-300 text-sm" title="粘贴"><i class="fa-solid fa-paste text-blue-500 text-base"></i> <span class="hidden xl:inline font-medium">粘贴</span></button>
                        <button onclick="reqClearEditor()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-red-600 dark:text-red-400 text-sm" title="清空"><i class="fa-solid fa-trash-can text-base"></i> <span class="hidden lg:inline font-medium">清空</span></button>
                        <button onclick="reqResetEditor()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-gray-700 dark:text-gray-300 text-sm" title="重置文档"><i class="fa-solid fa-rotate-right text-green-600 dark:text-green-400 text-base"></i> <span class="hidden lg:inline font-medium">重置</span></button>
                        <button onclick="openHistoryModal()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-purple-600 dark:text-purple-400 border-l border-gray-200 dark:border-slate-600 pl-3 ml-1 text-sm" title="快照时光机"><i class="fa-solid fa-clock-rotate-left text-base"></i> <span class="hidden lg:inline font-medium">时光机</span></button>
                    </div>

                    <div class="flex bg-white dark:bg-slate-800 rounded p-1 border border-gray-200 dark:border-slate-700 shrink-0 shadow-sm transition-colors">
                        <button onclick="downloadMD()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-gray-700 dark:text-gray-300 text-sm" title="下载 MD"><i class="fa-solid fa-download text-indigo-500 dark:text-indigo-400 text-base"></i> <span class="hidden lg:inline font-medium">下载 MD</span></button>
                        <button onclick="copyMD()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-gray-700 dark:text-gray-300 text-sm" title="复制 MD"><i class="fa-regular fa-copy text-gray-600 dark:text-gray-400 text-base"></i> <span class="hidden lg:inline font-medium">复制 MD</span></button>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        <div class="flex bg-white dark:bg-slate-800 rounded p-1 border border-gray-200 dark:border-slate-700 select-none shadow-sm transition-colors">
                            <button id="btn-split" onclick="setMode('split')" class="px-4 py-1.5 rounded bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-blue-400 transition-all flex items-center gap-1.5 text-sm font-medium" title="分屏"><i class="fa-solid fa-table-columns text-base"></i> <span class="hidden md:inline">分屏</span></button>
                            <button id="btn-preview" onclick="setMode('preview')" class="px-4 py-1.5 rounded text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition-all flex items-center gap-1.5 text-sm font-medium" title="仅预览"><i class="fa-solid fa-desktop text-base"></i> <span class="hidden md:inline">预览</span></button>
                        </div>
                        <div class="flex bg-white dark:bg-slate-800 rounded p-1 border border-gray-200 dark:border-slate-700 shadow-sm transition-colors">
                            <button onclick="toggleTOC()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-gray-700 dark:text-gray-300 text-sm" title="开关大纲"><i class="fa-solid fa-list-ul text-teal-600 dark:text-teal-400 text-base"></i> <span class="hidden lg:inline font-medium">大纲</span></button>
                            <button onclick="toggleDarkMode()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-gray-700 dark:text-gray-300 text-sm" title="开关夜间模式"><i id="theme-icon" class="fa-solid fa-moon text-indigo-500 dark:text-yellow-400 text-base"></i> <span class="hidden lg:inline font-medium">主题</span></button>
                            <button onclick="toggleFullScreen()" class="px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-slate-700 rounded transition-all flex items-center gap-1.5 text-gray-700 dark:text-gray-300 text-sm" title="全屏"><i class="fa-solid fa-expand text-gray-700 dark:text-gray-400 text-base"></i> <span class="hidden lg:inline font-medium">全屏</span></button>
                        </div>
                    </div>
                    <div class="flex-1 hidden md:block"></div>
                    <div class="flex gap-2 w-full md:w-auto justify-end">
                        <button onclick="openConverterModal()" class="bg-blue-600 hover:bg-blue-700 dark:bg-blue-700 dark:hover:bg-blue-600 text-white px-4 py-2 rounded shadow-sm transition-all flex items-center gap-1.5 text-sm font-medium shrink-0"><i class="fa-solid fa-exchange-alt"></i> 转换输出</button>
                        
                        <div class="relative group shrink-0">
                            <button class="bg-slate-700 hover:bg-slate-800 dark:bg-slate-600 dark:hover:bg-slate-500 text-white px-4 py-2 rounded shadow-sm transition-all flex items-center gap-1.5 text-sm font-medium"><i class="fa-solid fa-file-export"></i> 更多导出 <i class="fa-solid fa-chevron-down text-xs"></i></button>
                            <div class="absolute right-0 top-full pt-2 w-48 hidden group-hover:block z-[100]">
                                <div class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-lg shadow-xl py-1 overflow-hidden relative">
                                    <button onclick="exportPDF()" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition flex items-center gap-2.5"><i class="fa-solid fa-file-pdf w-4 text-center text-red-500"></i> 高清 PDF</button>
                                    <button onclick="exportWord()" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition flex items-center gap-2.5"><i class="fa-solid fa-file-word w-4 text-center text-blue-500"></i> Word (.docx)</button>
                                    <button onclick="exportImage()" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition flex items-center gap-2.5"><i class="fa-solid fa-image w-4 text-center text-purple-500"></i> 高清长图 (.png)</button>
                                    <button onclick="exportHTML()" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition flex items-center gap-2.5"><i class="fa-solid fa-file-code w-4 text-center text-orange-500"></i> HTML 网页</button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </header>

            <main id="main-workspace" class="flex flex-row flex-1 relative bg-white dark:bg-slate-800 items-stretch overflow-hidden w-full h-full">
                
                <aside id="toc-pane" class="hidden flex-col bg-gray-50 dark:bg-slate-900 shrink-0 h-full w-[220px]" style="flex: 0 0 220px;">
                    <div class="bg-gray-100 dark:bg-slate-800 px-4 py-2 text-sm font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider border-b border-gray-200 dark:border-slate-700 shrink-0 flex justify-between items-center" style="height:44px;">
                        <span><i class="fa-solid fa-location-crosshairs mr-1"></i> 文档大纲</span>
                        <button onclick="toggleTOC()" class="hover:text-red-500 dark:hover:text-red-400 transition" title="隐藏大纲"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <div id="toc-list" class="p-4 flex-1 overflow-y-auto space-y-1.5 text-sm"></div>
                </aside>

                <div id="toc-resizer" class="hidden md:flex flex-col justify-center items-center w-2 cursor-col-resize bg-gray-50 dark:bg-slate-900 border-r border-gray-200 dark:border-slate-700 hover:bg-gray-200 dark:hover:bg-slate-600 transition-colors z-20 shrink-0 h-full group">

                        <div id="tab-plain" class="w-full h-full flex flex-col hidden"><textarea id="output-plain" class="flex-1 w-full p-4 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-950 text-gray-800 dark:text-gray-200 rounded-md font-mono text-sm resize-none" readonly></textarea></div>
                        <div id="tab-rich" class="w-full h-full flex flex-col hidden"><div id="output-rich" class="flex-1 w-full p-4 border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-950 text-gray-800 dark:text-gray-200 rounded-md overflow-y-auto prose dark:prose-invert max-w-none"></div></div>
                        <div id="tab-html" class="w-full h-full flex flex-col hidden"><textarea id="output-html" class="flex-1 w-full p-4 border border-gray-300 dark:border-slate-600 rounded-md font-mono text-sm resize-none text-green-500 bg-gray-900" readonly></textarea></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="history-modal" class="fixed inset-0 bg-black bg-opacity-50 z-[150] hidden flex items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-11/12 md:w-3/4 lg:w-2/3 h-[80vh] flex flex-col overflow-hidden transition-colors">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-slate-700 flex justify-between items-center bg-gray-50 dark:bg-slate-900 shrink-0 transition-colors">
                <h3 class="text-lg font-bold text-gray-800 dark:text-gray-200"><i class="fa-solid fa-clock-rotate-left text-purple-600 mr-2"></i>时光机快照</h3>
                <div class="flex items-center">
                    <button onclick="manualSnapshot(); renderHistoryListModal();" class="mr-4 text-sm bg-purple-100 text-purple-700 px-3 py-1.5 rounded transition shadow-sm font-medium"><i class="fa-solid fa-camera mr-1.5"></i>打快照</button>
                    <button onclick="closeHistoryModal()" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
            </div>
            <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                <div class="w-full md:w-1/3 border-b md:border-b-0 md:border-r border-gray-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 transition-colors">
                    <div class="bg-gray-100 dark:bg-slate-800 px-4 py-2 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider border-b border-gray-200 dark:border-slate-700 shrink-0 transition-colors"><span>快照列表</span></div>
                    <div id="history-list" class="p-4 overflow-y-auto flex-1 space-y-3 text-sm"></div>
                </div>
                <div class="w-full md:w-2/3 flex flex-col bg-white dark:bg-slate-800 transition-colors">
                    <div class="bg-gray-100 dark:bg-slate-800 px-4 py-2 text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider border-b border-gray-200 dark:border-slate-700 shrink-0 transition-colors"><span>快照预览</span></div>
                    <div id="history-preview" class="flex-1 overflow-y-auto p-4 prose dark:prose-invert max-w-none"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
